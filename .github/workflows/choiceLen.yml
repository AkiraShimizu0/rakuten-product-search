name: ChoiceLen authorized canary deploy
on:
  workflow_dispatch:
  push:
    branches: [day6-1-production-publication, choicelen-editorial-design-v1]
permissions:
  contents: read
concurrency:
  group: choicelen-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-choicelen]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate frozen article and code
        run: |
          go test ./...
          go vet ./...
          git diff --check
      - name: Install pinned official Wrangler
        run: npm install --no-save --package-lock=false wrangler@4.147.0
      - name: Preview deploy bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/choicelen-preview
      - name: Deploy authorized single article
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
