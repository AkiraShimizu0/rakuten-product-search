name: Private Price Radar history
on:
  workflow_dispatch:
    inputs:
      bootstrap:
        type: boolean
        default: false
  workflow_call:
  push:
    branches: [family-sampling-radar-history]
permissions:
  contents: read
concurrency:
  group: private-price-radar-history
  cancel-in-progress: false
jobs:
  observe:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[radar-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RADAR_BOOTSTRAP_1: ${{ secrets.RADAR_BOOTSTRAP_1 }}
      RADAR_BOOTSTRAP_2: ${{ secrets.RADAR_BOOTSTRAP_2 }}
      RADAR_BOOTSTRAP_3: ${{ secrets.RADAR_BOOTSTRAP_3 }}
      RADAR_BOOTSTRAP_4: ${{ secrets.RADAR_BOOTSTRAP_4 }}
      RADAR_BOOTSTRAP_5: ${{ secrets.RADAR_BOOTSTRAP_5 }}
      RADAR_BOOTSTRAP_6: ${{ secrets.RADAR_BOOTSTRAP_6 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Compile and test private history collector
        run: |
          go test ./internal/radar ./internal/radarhistory ./internal/rakuten
          go build -o radar-history ./cmd/radar-history
      - name: Import observed history once
        if: inputs.bootstrap == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[radar-bootstrap]'))
        run: ./radar-history -stage bootstrap
      - name: Append current offers (no publication, no LLM)
        run: ./radar-history -stage run
      - name: Monitor last attempt and last successful run
        if: always()
        run: ./radar-history -stage status
